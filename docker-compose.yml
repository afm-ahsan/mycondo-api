# MyCondo — local development infrastructure (Docker Compose path).
# Brings up PostgreSQL 18 + Redis 8.6 + Mailhog. The API and SignalR run via `dotnet run` from
# the host during dev; once the API has a Dockerfile (Phase 3+), uncomment the `api` service.
#
# This is the ADR-016 role-split model (mycondo_migrator/mycondo_app) — the local execution mode
# that actually exercises RLS/least-privilege, same as production is intended to. It is a distinct,
# parallel path from the native-PostgreSQL-Windows-service setup documented in README.md/CLAUDE.md
# (which uses dev_user/mycondo for day-to-day convenience and does NOT validate RLS). See the
# Developer Environment Matrix in README.md for the full comparison across Native/Docker/
# Testcontainers/Production.
#
# Common commands:
#   docker compose up -d                  # start postgres + redis + mailhog
#   docker compose ps                      # status
#   docker compose logs -f postgres        # tail logs
#   docker compose down                    # stop (volumes preserved)
#   docker compose down -v                 # stop and WIPE volumes (destructive)

name: mycondo

services:
  postgres:
    image: postgres:18-alpine
    container_name: mycondo-postgres
    restart: unless-stopped
    environment:
      # This is the initdb bootstrap role — Postgres always makes it a superuser, which
      # unconditionally bypasses Row-Level Security. It must stay DDL-only (migrations); the running
      # API/DbMigrator connect as the restricted mycondo_app role instead, created by
      # db/init/01_create_app_role.sql on first boot. See mycondo-docs ADR-016.
      POSTGRES_USER: mycondo_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — see .env.example}
      POSTGRES_DB: mycondo_dev
      # Reasonable dev defaults; production tuning happens in the AWS RDS parameter group
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Host port 5433, not 5432 — this machine also runs a native PostgreSQL 18 Windows service
      # bound to the default 5432, and both may need to run at once. Container-internal port stays
      # the Postgres default (5432); only the host-side mapping changes, so nothing inside Compose
      # (services connecting via the `postgres` hostname) is affected.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, on first boot against an empty data volume — creates the restricted mycondo_app
      # role. If you already have an existing postgres_data volume from before this change, this
      # script will NOT run retroactively; either `docker compose down -v` (destroys local dev data)
      # and re-up, or run db/init/01_create_app_role.sql manually against the running container.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycondo_migrator -d mycondo_dev"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.6-alpine
    container_name: mycondo-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1000"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mycondo-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP — point Notifications module at smtp://localhost:1025
      - "8025:8025"  # Web UI — view captured emails at http://localhost:8025

  # api:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: mycondo-api
  #   restart: unless-stopped
  #   environment:
  #     ASPNETCORE_ENVIRONMENT: Development
  #     ASPNETCORE_URLS: http://+:8080
  #     MYCONDO_DB_CONNECTION_STRING: Host=postgres;Port=5432;Database=mycondo_dev;Username=mycondo_app;Password=mycondo_dev
  #     MYCONDO_REDIS_CONNECTION_STRING: redis:6379
  #     MYCONDO_SMTP_HOST: mailhog
  #     MYCONDO_SMTP_PORT: "1025"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   ports:
  #     - "5219:8080"  # host-side port per docs/local-development-ports.md; container stays plain HTTP
  #   healthcheck:
  #     test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/live"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3

  # jobs:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #     target: jobs-runtime
  #   container_name: mycondo-jobs
  #   restart: unless-stopped
  #   environment:
  #     # Same connection strings as api; jobs run Hangfire workers off the same DB
  #     MYCONDO_DB_CONNECTION_STRING: Host=postgres;Port=5432;Database=mycondo_dev;Username=mycondo_app;Password=mycondo_dev
  #     MYCONDO_REDIS_CONNECTION_STRING: redis:6379
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  postgres_data:
    name: mycondo_postgres_data
  redis_data:
    name: mycondo_redis_data
